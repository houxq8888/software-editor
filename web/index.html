<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Editor - 开发进度监控面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            margin: 20px 0;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        
        .progress-ring {
            width: 80px;
            height: 80px;
        }
        
        .task-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary-color);
        }
        
        .task-item.completed {
            border-left-color: var(--success-color);
        }
        
        .task-item.in-progress {
            border-left-color: var(--warning-color);
        }
        
        .task-item.pending {
            border-left-color: var(--danger-color);
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .refresh-btn {
            background: var(--primary-color);
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }
        
        .status-completed {
            background: var(--success-color);
            color: white;
        }
        
        .status-in-progress {
            background: var(--warning-color);
            color: white;
        }
        
        .status-pending {
            background: var(--danger-color);
            color: white;
        }
        
        .week-timeline {
            position: relative;
            padding-left: 30px;
        }
        
        .week-timeline::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--primary-color);
        }
        
        .week-marker {
            position: relative;
            margin-bottom: 30px;
        }
        
        .week-marker::before {
            content: '';
            position: absolute;
            left: -25px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 3px solid white;
            box-shadow: 0 0 0 3px var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 消息区域 -->
        <div id="message-area"></div>
        
        <!-- 加载状态 -->
        <div id="loading" class="text-center mb-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <span class="ms-2">数据加载中...</span>
        </div>

        <!-- 顶部导航 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded-3 mt-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-code me-2"></i>
                    Software Editor - 开发进度监控
                </a>
                <div class="navbar-nav ms-auto">
                    <button class="btn btn-outline-light me-2" onclick="refreshData()">
                        <i class="fas fa-sync-alt me-1"></i>刷新数据
                    </button>
                    <button class="btn btn-primary" onclick="generateReport()">
                        <i class="fas fa-download me-1"></i>生成报告
                    </button>
                </div>
            </div>
        </nav>

        <!-- 仪表板头部 -->
        <div class="dashboard-header">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1 class="display-6 fw-bold text-dark mb-2">开发进度监控面板</h1>
                    <p class="text-muted">实时监控详细开发实施计划的执行情况</p>
                </div>
                <div class="col-md-6 text-end">
                    <div class="d-flex justify-content-end align-items-center">
                        <div class="me-4">
                            <small class="text-muted">最后更新</small>
                            <div id="lastUpdate" class="fw-bold">--:--:--</div>
                        </div>
                        <div class="progress-ring me-3">
                            <canvas id="overallProgressRing"></canvas>
                        </div>
                        <div>
                            <div class="h2 mb-0 fw-bold text-primary" id="overallProgress">0%</div>
                            <small class="text-muted">总体进度</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row">
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <i class="fas fa-tasks fa-2x text-primary"></i>
                        </div>
                        <div>
                            <div class="h4 mb-0 fw-bold" id="totalTasks">0</div>
                            <small class="text-muted">总任务数</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <i class="fas fa-check-circle fa-2x text-success"></i>
                        </div>
                        <div>
                            <div class="h4 mb-0 fw-bold" id="completedTasks">0</div>
                            <small class="text-muted">已完成</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <i class="fas fa-spinner fa-2x text-warning"></i>
                        </div>
                        <div>
                            <div class="h4 mb-0 fw-bold" id="inProgressTasks">0</div>
                            <small class="text-muted">进行中</small>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="stat-card">
                    <div class="d-flex align-items-center">
                        <div class="me-3">
                            <i class="fas fa-clock fa-2x text-danger"></i>
                        </div>
                        <div>
                            <div class="h4 mb-0 fw-bold" id="pendingTasks">0</div>
                            <small class="text-muted">待处理</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="row">
            <div class="col-lg-8">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">
                        <i class="fas fa-chart-line me-2"></i>每周进度趋势
                    </h5>
                    <canvas id="weeklyProgressChart" height="300"></canvas>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">
                        <i class="fas fa-chart-pie me-2"></i>任务状态分布
                    </h5>
                    <canvas id="taskStatusChart" height="300"></canvas>
                </div>
            </div>
        </div>

        <!-- 任务详情 -->
        <div class="row">
            <div class="col-12">
                <div class="chart-container">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">
                            <i class="fas fa-list-check me-2"></i>详细任务列表
                        </h5>
                        <div class="btn-group">
                            <button class="btn btn-outline-primary btn-sm active" onclick="filterTasks('all')">全部</button>
                            <button class="btn btn-outline-primary btn-sm" onclick="filterTasks('completed')">已完成</button>
                            <button class="btn btn-outline-primary btn-sm" onclick="filterTasks('in-progress')">进行中</button>
                            <button class="btn btn-outline-primary btn-sm" onclick="filterTasks('pending')">待处理</button>
                        </div>
                    </div>
                    <div id="taskList" class="week-timeline">
                        <!-- 任务列表将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 验收检查结果 -->
        <div class="row">
            <div class="col-12">
                <div class="chart-container">
                    <h5 class="fw-bold mb-3">
                        <i class="fas fa-clipboard-check me-2"></i>验收检查结果
                    </h5>
                    <div id="acceptanceResults">
                        <!-- 验收结果将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
