name: Automated Testing

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每小时运行一次自动化测试
    - cron: '0 * * * *'

env:
  PYTHON_VERSION: '3.11'
  TEST_TIMEOUT: '1800'  # 30分钟超时

jobs:
  ui-automation-tests:
    name: UI Automation Tests
    runs-on: windows-latest
    timeout-minutes: 45
    
    strategy:
      matrix:
        test-suite: ['product-config', 'ui-layout', 'packaging', 'preview']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install test dependencies
      run: |
        pip install -r test/ui_automation/requirements.txt
        pip install pytest pytest-html pytest-xdist

    - name: Setup virtual display (for headless testing)
      uses: GabrielBB/xvfb-action@v1
      with:
        run: echo "Virtual display setup complete"

    - name: Run specific test suite
      run: |
        cd test/ui_automation
        
        case "${{ matrix.test-suite }}" in
          "product-config")
            python -m pytest test_product_config.py -v --html=test-results/product-config-report.html --self-contained-html
            ;;
          "ui-layout")
            python -m pytest test_ui_layout_editor.py -v --html=test-results/ui-layout-report.html --self-contained-html
            ;;
          "packaging")
            python -m pytest test_packaging.py -v --html=test-results/packaging-report.html --self-contained-html
            ;;
          "preview")
            python -m pytest test_preview.py -v --html=test-results/preview-report.html --self-contained-html
            ;;
        esac
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.test-suite }}
        path: |
          test/ui_automation/test-results/
          test/ui_automation/screenshots/
        retention-days: 30

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: UI Automation Tests - ${{ matrix.test-suite }}
        path: test/ui_automation/test-results/*.html
        reporter: jest-html-reporter

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: ui-automation-tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install -r test/ui_automation/requirements.txt

    - name: Run integration tests
      run: |
        cd test/ui_automation
        python ci_test_pipeline.py --integration --generate-report
      continue-on-error: true

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: test/ui_automation/test_results/
        retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install performance testing tools
      run: |
        pip install locust pyperf

    - name: Run performance tests
      run: |
        cd test/ui_automation
        python -c "
        import time
        import psutil
        
        # 模拟性能测试
        print('Starting performance tests...')
        
        # 测试内存使用
        memory_info = psutil.virtual_memory()
        print(f'Memory usage: {memory_info.percent}%')
        
        # 测试CPU使用
        cpu_percent = psutil.cpu_percent(interval=1)
        print(f'CPU usage: {cpu_percent}%')
        
        # 模拟测试执行时间
        start_time = time.time()
        time.sleep(5)  # 模拟5秒测试执行
        end_time = time.time()
        
        print(f'Test execution time: {end_time - start_time:.2f} seconds')
        print('Performance tests completed')
        "

    - name: Upload performance metrics
      uses: actions/upload-artifact@v4
      with:
        name: performance-metrics
        path: performance-results/
        retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: windows-latest
    needs: [ui-automation-tests, integration-tests, performance-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-test-results

    - name: Generate test summary
      run: |
        echo "# Test Summary Report" > test-summary.md
        echo "Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" >> test-summary.md
        echo "" >> test-summary.md
        echo "## Test Results Overview" >> test-summary.md
        echo "" >> test-summary.md
        
        # 这里可以添加更复杂的测试结果分析逻辑
        echo "- UI Automation Tests: ${{ needs.ui-automation-tests.result }}" >> test-summary.md
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> test-summary.md
        echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> test-summary.md
        echo "" >> test-summary.md
        echo "All test artifacts have been uploaded as workflow artifacts."

    - name: Upload test summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: test-summary.md
        retention-days: 30

    - name: Comment on PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const summary = `# Test Results Summary
          
          **UI Automation Tests:** ${{ needs.ui-automation-tests.result }}
          **Integration Tests:** ${{ needs.integration-tests.result }}
          **Performance Tests:** ${{ needs.performance-tests.result }}
          
          Detailed test results are available as workflow artifacts.`
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          })